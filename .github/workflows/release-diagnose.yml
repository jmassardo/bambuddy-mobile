name: Diagnose Android Promotion

# Read-only investigation of a failed production promotion. It lists every Play
# track, then validates candidate promotion edits through the Play edit API without
# committing any of them, so Google Play returns its precise rejection reason for each
# destination track and each release-notes variant. The whole run commits nothing, so the
# release pipeline stays untouched while it runs.
# Google Play permits one open edit per app: do not run this while a release
# promotion is in flight.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Store version of the stuck candidate
        required: true
        default: "1.1.2"
      build_number:
        description: AAB versionCode of the stuck candidate
        required: true
        default: "6"

permissions:
  contents: read

concurrency:
  group: release-diagnose-play-edit
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read Play state without touching it
    runs-on: ubuntu-latest
    environment: release-query
    timeout-minutes: 15
    steps:
      - name: Check out the queried commit
        uses: actions/checkout@de0fac2e454053618664117671699f5c1779d597 # v6.0.4
        with:
          fetch-depth: 0
      - name: Set up Ruby
        uses: ruby/setup-ruby@080f6bbd373e92bb07c1e9a4d0b32c725f343907 # v1.210.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@60dc492f8f5a5a21c4625ac85372b514f67b8c82 # v5.0.0
        with:
          node-version: "22"
      - name: Prepare store credentials
        run: node scripts/release/pipeline.js credentials
        env:
          PIPELINE_CREDENTIALS: match,google,app-store
          PIPELINE_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      # Supply's promotion copies the internal release verbatim, which cannot carry
      # release notes the internal release never had. These probes build the destination
      # release explicitly so release notes can be tested against each track.
      - name: Validate candidate promotion edits without committing them
        continue-on-error: true
        run: |
          set -uo pipefail
          for track in production beta alpha; do
            for notes in true false; do
              bundle exec fastlane android diagnose_promote_api \
                version:"${{ inputs.version }}" \
                build_number:"${{ inputs.build_number }}" \
                to_track:"$track" notes:"$notes" || true
            done
          done
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          RELEASE_STORE_METADATA_PATH: ${{ runner.temp }}/store-release-metadata.json
      - name: Read every Play track
        continue-on-error: true
        run: bundle exec fastlane android diagnose_play
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
      - name: Read every App Store version
        continue-on-error: true
        run: bundle exec fastlane ios release_metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          RELEASE_STORE_METADATA_PATH: ${{ runner.temp }}/store-release-metadata.json
      - name: Remove temporary store credentials
        if: always()
        run: node scripts/release/pipeline.js cleanup-credentials
