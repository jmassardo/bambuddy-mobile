name: Diagnose Android Promotion

# Read-only investigation of a failed production promotion. It lists every Play
# track, replays the exact promotion edit with validate_only, and replays it again
# with synthesized release notes, so Google Play returns its precise rejection
# reason without an edit ever being committed.
# Google Play permits one open edit per app: do not run this while a release
# promotion is in flight.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Store version of the stuck candidate
        required: true
        default: "1.1.2"
      build_number:
        description: AAB versionCode of the stuck candidate
        required: true
        default: "6"

permissions:
  contents: read

env:
  FASTLANE_SKIP_DOCS: "1"
  BUNDLE_FORCE_RUBY_PLATFORM: "1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: release-query
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Keep Bundler configuration outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/bambuddy-bundler"
          echo "BUNDLE_APP_CONFIG=$RUNNER_TEMP/bambuddy-bundler" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Only the Google Play service account is needed: the App Store lanes read
      # their own credentials straight from the environment.
      - name: Prepare Google Play credentials
        run: node scripts/release/pipeline.js credentials google
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_CONTENT }}
      - name: Read every Play track
        run: bundle exec fastlane android diagnose_play
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
      # The stores are independent: a broken App Store agreement must not hide
      # what Google Play says about the promotion.
      - name: Read every App Store version
        continue-on-error: true
        run: bundle exec fastlane ios release_metadata
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          RELEASE_STORE_METADATA_PATH: ${{ runner.temp }}/store-release-metadata.json
      - name: Replay the production promotion with validate_only
        continue-on-error: true
        run: bundle exec fastlane android diagnose_promote
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
      - name: Validate the promotion with synthesized production release notes
        continue-on-error: true
        run: bundle exec fastlane android diagnose_promote changelogs:true
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
      - name: Remove temporary store credentials
        if: always()
        run: node scripts/release/pipeline.js cleanup-credentials
