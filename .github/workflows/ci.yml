name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm test -- --ci --coverage

  build-ios:
    name: Build iOS (Debug)
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: macos-latest
    needs: [typecheck, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: cd ios && pod install

      - run: bundle exec fastlane ios build_debug
        env:
          BAMBUDDY_DEMO_URL: ${{ secrets.BAMBUDDY_DEMO_URL }}
          BAMBUDDY_DEMO_USERNAME: ${{ secrets.BAMBUDDY_DEMO_USERNAME }}
          BAMBUDDY_DEMO_PASSWORD: ${{ secrets.BAMBUDDY_DEMO_PASSWORD }}

  build-android:
    name: Build Android (Debug)
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: bundle exec fastlane android build_debug
        env:
          BAMBUDDY_DEMO_URL: ${{ secrets.BAMBUDDY_DEMO_URL }}
          BAMBUDDY_DEMO_USERNAME: ${{ secrets.BAMBUDDY_DEMO_USERNAME }}
          BAMBUDDY_DEMO_PASSWORD: ${{ secrets.BAMBUDDY_DEMO_PASSWORD }}

  release-candidate:
    name: Release Candidate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - id: select
        run: node scripts/release/pipeline.js select
      - name: Require candidate metadata
        run: test "$READY" = "true"
        env:
          READY: ${{ steps.select.outputs.ready }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.run_id }}
          name: release-candidate-${{ steps.select.outputs.run_id }}
          path: release-artifacts
      - run: node scripts/release/pipeline.js verify release-artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha }}
