name: CI

on:
  push:
    branches: [main, dev, develop]
  pull_request:
    branches: [main, dev, develop]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm test -- --ci --coverage

  build-ios:
    name: Build iOS (Debug)
    runs-on: macos-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - run: npm ci

      - run: cd ios && pod install

      - run: bundle exec fastlane ios build_debug
        env:
          BAMBUDDY_DEMO_URL: ${{ secrets.BAMBUDDY_DEMO_URL }}
          BAMBUDDY_DEMO_USERNAME: ${{ secrets.BAMBUDDY_DEMO_USERNAME }}
          BAMBUDDY_DEMO_PASSWORD: ${{ secrets.BAMBUDDY_DEMO_PASSWORD }}

  build-android:
    name: Build Android (Debug)
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

