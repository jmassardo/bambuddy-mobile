name: Promote Store Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      version: ${{ steps.select.outputs.version }}
      build_number: ${{ steps.select.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Reject an outdated main event
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - id: select
        run: node scripts/release/pipeline.js select
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.select.outputs.ready == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.select.outputs.run_id }}
          name: release-candidate-${{ steps.select.outputs.run_id }}
          path: release-artifacts
      - name: Verify tested commit, merged tree, store versions and binary checksums
        if: steps.select.outputs.ready == 'true'
        run: node scripts/release/pipeline.js verify release-artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ios:
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production-ios
    concurrency:
      group: production-ios
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject superseded production promotion
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_COMMIT"
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec fastlane ios promote

  android:
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production-android
    concurrency:
      group: production-android
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      BUILD_NUMBER: ${{ needs.verify.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject superseded production promotion
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_COMMIT"
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Prepare store API credentials only
        run: node scripts/release/pipeline.js credentials google
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_CONTENT }}
      - run: bundle exec fastlane android promote
      - name: Remove temporary store credentials
        if: always()
        run: node scripts/release/pipeline.js cleanup-credentials

  sync-develop:
    needs: [verify, ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Fast-forward release metadata without a recursive release
        run: node scripts/release/pipeline.js sync-develop
        env:
          GITHUB_TOKEN: ${{ github.token }}
