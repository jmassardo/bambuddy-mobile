version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/tools/build-tools"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
