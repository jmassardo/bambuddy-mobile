# Cloud agent environment setup for BambuBuddy Mobile
# This configures the GitHub-hosted cloud agent with the tools needed to work on this repo.

steps:
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version-file: .nvmrc
      cache: npm

  - name: Install npm dependencies
    run: npm ci

  - name: Set up Ruby
    uses: ruby/setup-ruby@v1
    with:
      ruby-version-file: .ruby-version
      bundler-cache: true

  - name: Set up Java (for Android builds)
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
